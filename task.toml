expert_time_estimate_hours = 6
relevant_experience = """
Anyone who has had to reproduce a laboratory's own figures from its own books
will know the shape of this. The published method covers the ordinary path and
the hands that worked it carried the rest, and the only way back to their
arithmetic is the cases they certificated. Chronometer rating is the classic
instance: a rate depends on the position the instrument lies in as much as on
the escapement, an instrument takes days to come to a new temperature, and a
trial number is a figure of merit whose parts each have to be reckoned on the
right subset of the run. Reading a comparison book against a standard clock
whose own rate has to be put back is ordinary work for anyone who has kept an
instrument log.
"""

